services:
  postgres:
    image: postgres:16-alpine
    container_name: railway-postgres
    environment:
      POSTGRES_DB: railway_gateway
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: railway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: railway
      RABBITMQ_DEFAULT_PASS: railway_secret
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  minio:
    image: minio/minio:latest
    container_name: railway-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network


  qdrant:
    image: qdrant/qdrant:latest
    container_name: railway-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - railway-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: railway-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/railway_gateway
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - railway-network

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: railway-document-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: railway
      RABBITMQ_PASSWORD: railway_secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      gateway:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - railway-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: railway-ai-service
    environment:
      AI_API_URL: ${AI_API_URL:-http://host.docker.internal:11435/v1}
      AI_API_KEY: ${AI_API_KEY:-sk-local-key}
      QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-qwen3-8b}
      USE_LOCAL_AI: ${USE_LOCAL_AI:-true}
      AI_MOCK: ${AI_MOCK:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: railway
      RABBITMQ_PASSWORD: railway_secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DEFAULT_REGION: chita
      QDRANT_URL: http://qdrant:6333
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
#      qdrant:
#        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - railway-network
    restart: unless-stopped

  assembler-service:
    build:
      context: ./assembler-service
      dockerfile: Dockerfile
    container_name: railway-assembler-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: railway
      RABBITMQ_PASSWORD: railway_secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LIBREOFFICE_PATH: /usr/bin/soffice
    depends_on:
      gateway:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - railway-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - railway-network

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:

networks:
  railway-network:
    driver: bridge